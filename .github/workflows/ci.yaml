name: Exception-Handling-Spring-Boot-Starter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }} # one group per branch/PR
  cancel-in-progress: true    # a new run cancels the old one in the same group

jobs:
  verify:
    name: Build, Test, Analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7     # download the repo onto the runner
        with:
          fetch-depth: 0              # full git history (Sonar needs it)
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  #v5   # install Java
        with:
          distribution: temurin
          java-version: "25"
          cache: maven            # cache Maven dependencies

      - run: chmod +x mvnw        # make the Maven wrapper executable

      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      - name: Test
        run: ./mvnw -B -ntp test

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Khinya-Khinev_Exception-Handling-Spring-Boot-Starter
          -Dsonar.organization=khinya-organisation

  docker:
    name: Docker image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # build and push the image only after merging into main
    runs-on: ubuntu-24.04

    permissions:
      contents: read   # lets the job download sources
      packages: write  # lets the job push images to GitHub Container Registry

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - run: chmod +x mvnw

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6
        with:
          images: ghcr.io/${{ github.repository }}
          # creating tags
          tags: |
            type=sha
            type=ref,event=branch 

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
